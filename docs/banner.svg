<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="drive-hub-sync: seus projetos organizados no Google Drive">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.6" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f0ff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <circle cx="1120" cy="-20" r="220" fill="#ffffff" opacity="0.07"/>
  <circle cx="1220" cy="380" r="160" fill="#ffffff" opacity="0.08"/>
  <circle cx="60" cy="420" r="140" fill="#ffffff" opacity="0.06"/>

  <!-- Texto -->
  <text x="80" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#bfdbfe" letter-spacing="3">PLUGIN PARA CLAUDE CODE E AGY</text>
  <text x="80" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff">drive-hub-sync</text>
  <text x="80" y="285" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#e0ecff">Seus projetos organizados no Google Drive.</text>
  <text x="80" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#e0ecff">Sem copiar uma linha de código.</text>

  <!-- Ilustração: pastas -->
  <g fill="#0b1b4d" opacity="0.28">
    <rect x="800" y="120" width="380" height="64" rx="14"/>
    <rect x="830" y="206" width="380" height="64" rx="14"/>
    <rect x="800" y="292" width="380" height="64" rx="14"/>
  </g>
  <g>
    <rect x="800" y="110" width="380" height="64" rx="14" fill="url(#card)"/>
    <rect x="830" y="196" width="380" height="64" rx="14" fill="url(#card)"/>
    <rect x="800" y="282" width="380" height="64" rx="14" fill="url(#card)"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#1e3a8a">
    <text x="860" y="151">02 · Arquitetura e Diagramas</text>
    <text x="890" y="237">03 · Releases e Roadmap</text>
    <text x="860" y="323">04 · Marketing e Landing Page</text>
  </g>
  <g>
    <circle cx="830" cy="142" r="14" fill="#2563eb"/>
    <circle cx="860" cy="228" r="14" fill="#06b6d4"/>
    <circle cx="830" cy="314" r="14" fill="#f59e0b"/>
  </g>
</svg>
